services:
  gitea:
    image: gitea/gitea:latest
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://127.0.0.1:3000/
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # РАСПАКОВЩИК: Подготавливает файлы Битрикса из архивов
  bitrix-init:
    image: php:8.2-fpm-alpine
    user: root
    volumes:
      - bitrix-data:/var/www/html
      - ../tmp/upload.tar:/tmp/upload.tar:ro
      - ../tmp/local.tar:/tmp/local.tar:ro
      - ./init/bitrix-settings.php:/tmp/settings.php:ro
    command:
      - sh
      - -c
      - |
        set -e
        echo "--- STARTING INIT ---"

        # 1. Распаковка Ядра (bitrix, upload, и т.д.)
        if [ ! -d /var/www/html/bitrix ]; then
            echo "Extracting core (upload.tar)..."
            tar -xf /tmp/upload.tar -C /var/www/html/ --strip-components=1
        fi

        # 2. Распаковка Модулей
        echo "Updating local files (local.tar)..."
        mkdir -p /var/www/html/local
        tar -xf /tmp/local.tar -C /var/www/html/local/ --strip-components=1

        # 3. Установка конфига
        echo "Installing .settings.php..."
        mkdir -p /var/www/html/bitrix
        cp /tmp/settings.php /var/www/html/bitrix/.settings.php

        # 4. Права
        echo "Setting permissions..."
        chown -R 82:82 /var/www/html
        echo "--- DONE ---"

  bitrix-php:
    build:
      context: .
      dockerfile: Dockerfile.php
    volumes:
      - bitrix-data:/var/www/html
    depends_on:
      bitrix-db:
        condition: service_healthy
      bitrix-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bitrix-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitrix
      POSTGRES_USER: bitrix
      POSTGRES_PASSWORD: bitrix
    volumes:
      - bitrix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitrix"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bitrix-nginx:
    image: nginx:alpine
    volumes:
      - bitrix-data:/var/www/html:ro
      - ./nginx-bitrix.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - bitrix-php
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    ports:
      - "5556:5556"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5556/dex/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # АВТОМАТИЗАЦИЯ: устанавливает модуль и регистрирует вебхуки после запуска стека
  bitrix-setup:
    build:
      context: .
      dockerfile: Dockerfile.php
    volumes:
      - bitrix-data:/var/www/html
    environment:
      BITRIX_WEBHOOK_URL: http://bitrix-nginx
      HANDLER_BASE_URL: http://127.0.0.1:3101
    depends_on:
      bitrix-php:
        condition: service_healthy
      bitrix-nginx:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "--- BITRIX SETUP ---"
        echo "Запуск bx:install..."
        bx bx:install
        echo "Регистрация вебхуков..."
        bx bx:webhook-reg ONCRMDEALADD
        bx bx:webhook-reg ONCRMDEALUPDATE
        bx bx:webhook-reg ONCRMDEALDELETE
        echo "Проверка зарегистрированных вебхуков:"
        bx bx:webhook-reg
        echo "--- SETUP DONE ---"
    restart: "no"

  # TELEGRAM-БОТ: LangChain + GigaChat для автоматизации тендерного отдела
  tender-bot:
    build:
      context: ./tender-bot
      dockerfile: Dockerfile
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      BITRIX_WEBHOOK_URL: http://bitrix-nginx
      HANDLER_BASE_URL: http://tender-bot:8000
    ports:
      - "3102:8000"
    depends_on:
      bitrix-nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  gitea-data:
  bitrix-data:
  bitrix-db-data:
  dex-data:
