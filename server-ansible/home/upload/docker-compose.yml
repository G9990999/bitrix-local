services:
  bitrix-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: bitrix
      POSTGRES_USER: bitrix
      POSTGRES_PASSWORD: bitrix
    ports:
      - "5432:5432" # <--- Добавьте эту строку
    volumes:
      - bitrix-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitrix"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  bitrix-db:
  bitrix-db-data:
