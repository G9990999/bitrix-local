server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # REST API: маршрутизация event.bind.json / event.get.json на обработчик Битрикса
    # Без этого nginx отдавал запросы на мастер-скрипт установки вместо REST
    location ~* ^/(event\.[^/]+\.json)$ {
        rewrite ^/(.*)$ /bitrix/services/rest/index.php?_method=$1 last;
    }

    location ~* ^/rest/(.*)$ {
        rewrite ^/rest/(.*)$ /bitrix/services/rest/index.php?_method=$1 last;
    }

    location /dex {
       auth_request /dex-auth;
       error_page 401 = @dex_login;
       proxy_pass http://127.0.0.1:8080;
    }

    location /dex-auth {
       internal;
       proxy_pass http://dex:5556/dex/userinfo;
       proxy_pass_request_body off;
       proxy_set_header Content-Length "";
       proxy_set_header X-Original-URI $request_uri;
       proxy_set_header Host $host;
    }

    location @dex_login {
       return 302 http://127.0.0.1:5556/dex/auth?client_id=rolemodel&redirect_uri=http://127.0.0.1:3100/auth/callback&response_type=code&scope=openid+profile+email;
    }

    location ~ \.php$ {
        fastcgi_pass bitrix-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
